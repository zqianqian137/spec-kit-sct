schema_version: "1.0"
preset:
  id: sct
  name: "SCT (Spec-Code-Test Consistency)"
  version: "1.0.0"
  description: "Preset for projects adopting SCT methodology. OPTIONAL hint-only overrides of the default Speckit commands — they add SCT methodology reminders (keep an acceptance.yaml SoT, run the sct commands after implementation) but NEVER auto-run any SCT command and NEVER change the original specify/plan/implement/constitution behavior. The sct extension stays non-intrusive."
  author: ai-test-platform-team
  repository: https://github.com/zqianqian137/spec-kit-sct
  license: MIT
  tags:
    - "sct"
    - "consistency"
    - "test-automation"
    - "ai-assisted"
  requires:
    speckit_version: ">=0.9.0"
    extensions:
      - sct
  overrides:
    commands:
      speckit.specify:
        file: commands/speckit.specify.md
        description: "(SCT) Same as core; appends an OPTIONAL hint to later consolidate acceptance criteria into acceptance.yaml (SoT). Does NOT run any SCT command."
      speckit.plan:
        file: commands/speckit.plan.md
        description: "(SCT) Same as core; appends an OPTIONAL hint to also produce data-model.md + api-contracts.md. Does NOT run any SCT command."
      speckit.implement:
        file: commands/speckit.implement.md
        description: "(SCT) Same as core; after implementing, appends an OPTIONAL reminder that the user MAY manually run speckit.sct.* commands. Does NOT auto-run codegen/check."
      speckit.constitution:
        file: commands/speckit.constitution.md
        description: "(SCT) Same as core; appends an OPTIONAL Spec-Code-Test consistency principle. Does NOT run any SCT command."
