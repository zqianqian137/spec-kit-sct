schema_version: "1.0"

extension:
  id: sct
  name: "Spec-Code-Test Consistency (SCT)"
  version: "2.0.0"
  description: "Test-domain extension for Spec Kit: auto-generate a test plan from spec + plan artifacts, derive write-once tests across unit / interface (protocol-agnostic) / e2e (scenario cases), and gate every change on hard evidence (coverage ≥90%, cases 100% passing, no missing coverage) with a human-reviewable report."
  author: zqianqian137
  repository: https://github.com/zqianqian137/spec-kit-sct
  homepage: https://github.com/zqianqian137/spec-kit-sct
  license: MIT
  # Community catalog metadata (fields shown on the spec-kit community
  # extensions page). category: docs|code|process|integration|visibility
  # effect: read-only | read-write
  category: process
  effect: read-write

requires:
  speckit_version: ">=0.9.0"
  tools:
    # Optional soft dependency: when the codebase-memory-mcp connector is connected,
    # testing.plan's impact step enriches the reverse trace (call-chain / DTO
    # resolution) via semantic code search. Works without it (falls back to ripgrep).
    - name: codebase-memory-mcp
      required: false
      description: "Optional code knowledge graph for enriched change-impact reverse tracing."

provides:
  commands:
    # ====== 3 commands: testing.plan → testing.design → testing.run ======
    - name: speckit.testing.plan
      file: commands/speckit.testing.plan.md
      description: "Auto-generate the test plan (acceptance.yaml) from spec.md + plan artifacts (plan/data-model/api-contracts); optional change-impact tiering (P0/P1/P2 + L1/L2/L3). Supports --ai for LLM extraction."
    - name: speckit.testing.design
      file: commands/speckit.testing.design.md
      description: "Test design + task planning: turn the plan into a test design (unit / interface protocol-agnostic / e2e scenario cases), then derive write-once test cases. May consult a skill pool to raise design quality. Emits a sha256 manifest that enforces write-once."
    - name: speckit.testing.run
      file: commands/speckit.testing.run.md
      description: "Execute derived tests, verify requirements are implemented, apply the hard gate (coverage ≥90%, cases 100% passing, no missing coverage) and write a human-reviewable report. Honest PASS/BLOCK/UNPROVEN; non-zero exit blocks the merge."

  # NOTE: SCT is intentionally NON-INTRUSIVE by default: it provides the 3
  # `speckit.testing.*` commands, and the single `after_plan` hook below is the
  # ONLY lifecycle integration — it auto-suggests generating the test plan right
  # after `specify plan` (optional: the user can skip it, then enrich by hand).
  # No other hook alters `specify / tasks / implement`.

# ====== lifecycle hook: auto-suggest the test plan after planning ======
# `after_plan` fires once the implementation plan exists. It surfaces
# `speckit.testing.plan`, which auto-generates a test-plan draft from
# spec.md + plan artifacts. `optional: true` means the user may skip it, and the
# generated plan is always hand-enrichable afterward.
hooks:
  after_plan:
    command: speckit.testing.plan
    optional: true
    prompt: "自动生成测试计划（acceptance.yaml）草稿？"
    description: "从 spec + plan 产物自动生成测试计划草稿，人工可补充调整"

tags:
  - "sct"
  - "testing"
  - "test-plan"
  - "test-automation"
  - "coverage-gate"
  - "ai-assisted"
  - "methodology"
  - "change-impact"
